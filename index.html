<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>中國象棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- #region CELL 1: UI CONTAINER & STATUS BAR -->
  <div class="game-wrapper">
    <header class="game-header">
      <h2>中國象棋</h2>
      <div class="status-bar">
        <span id="turn-indicator" class="turn red">紅方走棋</span>
      </div>
    </header>

    <!-- #region CELL 2: CANVAS BOARD CONTAINER -->
    <main class="board-container">
      <canvas id="chess-board"></canvas>
    </main>
    <!-- #endregion -->

    <!-- #region CELL 3: CONTROL BUTTONS -->
    <footer class="controls">
      <button id="btn-restart" class="btn">重新開始</button>
      <button id="btn-undo" class="btn">悔棋</button>
    </footer>
    <!-- #endregion -->
  </div>
  <!-- #endregion -->

  <script type="module" src="game.js"></script>
</body>
</html>
